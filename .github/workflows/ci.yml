name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  Lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js 22.x
      uses: actions/setup-node@v1.4.4
      with:
        node-version: 24
    - run: npm i && npm run lint
  
  PrepareTestedVersions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js 22.x
      uses: actions/setup-node@v1.4.4
      with:
        node-version: 24
    - id: set-matrix
      run: |
        node -e "
          const { testedVersions } = require('./src/lib/version');
          if (!Array.isArray(testedVersions) || !testedVersions.length || new Set(testedVersions).size !== testedVersions.length || testedVersions.some(v => typeof v !== 'string' || !v.trim())) throw new Error('Invalid test version matrix');
          console.log('matrix='+JSON.stringify({'include': testedVersions.map(mcVersion => ({mcVersion}))}))
        " >> $GITHUB_OUTPUT

  Test:
    needs: PrepareTestedVersions
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{fromJson(needs.PrepareTestedVersions.outputs.matrix)}}
      fail-fast: false

    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js 22.x
        uses: actions/setup-node@v1.4.4
        with:
          node-version: 24
      - name: Install Dependencies
        run: npm install
      - name: Start Tests
        run: npm run mocha_test -- -g ${{ matrix.mcVersion }}v

  # Stable branch-protection check; every required matrix job must pass.
  ci:
    name: ci
    if: ${{ always() }}
    needs: ["Lint", "PrepareTestedVersions", "Test"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all mandatory jobs to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_JOBS: '["Lint", "PrepareTestedVersions", "Test"]'
          MATRIX_OUTPUTS: '[["PrepareTestedVersions", "matrix", "include"]]'
        shell: python
        run: |
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          expected = json.loads(os.environ["EXPECTED_JOBS"])
          if not expected or set(needs) != set(expected):
              sys.exit("Missing or unexpected required jobs")
          failed = {name: job.get("result") for name, job in needs.items()
                    if job.get("result") != "success"}
          if failed:
              sys.exit("Required jobs did not succeed: " + json.dumps(failed))
          for job, output, field in json.loads(os.environ["MATRIX_OUTPUTS"]):
              matrix = json.loads(needs[job]["outputs"][output])
              entries = matrix[field] if field else matrix
              if not isinstance(entries, list) or not entries:
                  sys.exit("Empty or invalid required matrix: " + job)
          print("All required jobs succeeded")
